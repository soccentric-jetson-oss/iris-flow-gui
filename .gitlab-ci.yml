# GitLab CI/CD for iris-flow-gui — Camera pipeline PySide6 desktop GUI

stages:
  - build
  - test
  - lint
  - doc

variables:
  GIT_SUBMODULE_STRATEGY: none
  PYTHON_VERSION: "3.10"

build:
  stage: build
  image: python:$PYTHON_VERSION
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgl1-mesa-glx libegl1-mesa libxkbcommon0 2>/dev/null || true
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt 2>/dev/null || pip install PySide6 grpcio protobuf
    - python -m compileall src/
  artifacts:
    paths:
      - .venv/
    expire_in: 1 day

test:
  stage: test
  image: python:$PYTHON_VERSION
  needs: [build]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgl1-mesa-glx libegl1-mesa libxkbcommon0 2>/dev/null || true
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt 2>/dev/null || pip install PySide6 grpcio protobuf pytest
    - python -m pytest tests/ -v 2>/dev/null || python -m unittest discover -s tests -v

lint:
  stage: lint
  image: python:$PYTHON_VERSION
  script:
    - pip install pylint mypy
    - pylint --disable=C src/ 2>/dev/null || true
    - mypy src/ --ignore-missing-imports 2>/dev/null || true

doc:
  stage: doc
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq doxygen graphviz
  script:
    - doxygen docs/Doxyfile 2>/dev/null || echo "Doxygen not configured"
  artifacts:
    paths:
      - docs/html/
    expire_in: 1 week
