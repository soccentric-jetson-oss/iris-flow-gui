[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "$(basename $dir)"
version = "0.1.0"
description = "$(basename $dir) - PySide6 GUI"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5", "grpcio>=1.50", "protobuf>=3.21"]
